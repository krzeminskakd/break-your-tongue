<!DOCTYPE html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Break Your Tongue | Gramatyka, klasa 6</title><meta name="description" content="Interaktywna powtórka Present Simple, Present Continuous i state verbs. Pięć zestawów ćwiczeń i mini sprawdzian.">
<meta name="theme-color" content="#f5f8fc"><meta name="author" content="Break Your Tongue"><meta name="copyright" content="© 2026 Break Your Tongue. All rights reserved.">
<style>:root {
  --ink: #243147;
  --muted: #6b7890;
  --line: #e2e8f0;
  --bg: #f5f8fc;
  --paper: #ffffff;
  --accent: #d94e58;
  --accent-strong: #bc3544;
  --accent-soft: #fff0f2;
  --blue: #dae9ff;
  --radius: 16px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
html, body { margin:0; background:var(--bg)!important; color:var(--ink)!important; font-family: "Avenir Next", "Segoe UI", Arial, sans-serif!important; color-scheme:light!important;}
button, input { font:inherit; }
button { cursor:pointer; }
button:focus-visible, input:focus-visible { outline:3px solid #80a5ee; outline-offset:3px;}
.learning-app { min-height:100dvh; background:var(--bg); display:flex; flex-direction:column; }
.topbar { background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:40; }
.topbar-inner { height:76px; max-width:1440px; margin:auto; padding:0 40px; display:flex; align-items:center; justify-content:space-between; }
.wordmark { display:flex; align-items:center; gap:12px; border:0; background:transparent; color:var(--ink); font-size:17px; font-weight:750; padding:0; letter-spacing:-.6px;}
.wordmark strong {font-weight:850;}
.mark { display:flex; align-items:center; justify-content:center; width:41px; height:41px; border-radius:12px; background:var(--accent); color:white; font-weight:900; letter-spacing:-2px; font-size:23px; padding-right:5px; transform:rotate(-6deg);}
.mark-dot { color:#ffe1d9; }
.topbar-right { display:flex; align-items:center; gap:22px;}
.grade-chip { font-size:11px; letter-spacing:1px; font-weight:900; color:var(--accent-strong); background:var(--accent-soft); border-radius:100px; padding:8px 12px; }
.header-topic { color:var(--muted); font-weight:550; font-size:13px; }
.workspace { width:100%; max-width:1440px; margin:0 auto; flex:1; display:grid; grid-template-columns:264px minmax(0,1fr); align-items:start;}
.sidebar { padding:38px 18px 24px 31px; position:sticky; top:76px; min-height:calc(100dvh - 76px); border-right:1px solid var(--line); }
.eyebrow,.page-eyebrow { color:#8e9bb1; font-size:11px; letter-spacing:1.8px; font-weight:900;}
.sidebar-caption {margin:0 0 17px 17px;}
.side-menu {display:grid; gap:7px;}
.side-link { border:1px solid transparent; padding:13px 12px; width:100%; border-radius:12px; display:flex; text-align:left; align-items:center; gap:12px; background:transparent; color:#6d7a91; transition:background .2s,border-color .2s,transform .15s;}
.side-link:hover {background:white; transform:translateX(2px);}
.side-link.active { background:white; border-color:#dce5f2; color:var(--ink); box-shadow:0 8px 26px rgba(36,49,71,.04);}
.side-num {width:34px;height:34px; flex:none; display:flex;align-items:center;justify-content:center;background:#e8edf5;border-radius:9px;font-size:12px;font-weight:900;color:#7f8da3;}
.side-link.active .side-num {background:var(--accent);color:#fff;}
.side-link-text {display:flex;flex-direction:column;gap:3px; min-width:0;}
.side-link-text strong { font-size:14px;font-weight:800;}
.side-link-text small {font-size:11px;color:#8d9ab0;}
.side-chevron { margin-left:auto;color:#b3bfd0;font-size:24px; font-weight:300;line-height:1;}
.sidebar-progress {background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px;margin-top:35px;}
.sidebar-progress-heading {display:flex; justify-content:space-between; align-items:center;font-size:12px;font-weight:800;margin-bottom:12px;}
.sidebar-progress-heading strong {font-size:14px;color:var(--accent);}
.meter {height:7px;border-radius:100px;overflow:hidden;background:#e9eef5;}
.meter span {display:block;background:var(--accent);height:100%;border-radius:100px;transition:width .3s;}
.sidebar-progress p {font-size:11px; line-height:1.5; color:#8b98ab; margin:10px 0 0;}
.sidebar-progress p.progress-accent {color:var(--accent-strong);font-weight:700;}
.reset-link {border:0;background:transparent;padding:18px 10px;color:#8b98a9;font-size:12px;font-weight:650;}
.reset-link:hover {color:var(--accent);}
.sidebar-foot {position:absolute;bottom:32px;left:36px;right:22px;font-size:11px;line-height:1.7;color:#9ba7b9;}
.main-area { min-width:0; padding:34px 47px 70px;}
.hero {min-height:385px; padding:48px 28px 42px 52px;background:#e4edfb; border:1px solid #d7e5f7;border-radius:22px;display:grid;grid-template-columns:56% 44%;overflow:hidden;position:relative;align-items:center;}
.hero:before {content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:#eef5ff;right:-100px;top:-120px;opacity:.8;}
.hero-copy {position:relative;z-index:2;}
.hero-kicker {display:flex;align-items:center;gap:12px;color:#607a9c;font-size:11px;font-weight:900;letter-spacing:1.45px;margin-bottom:22px;}
.kicker-line {height:1px;width:36px;background:#9bb5d4;}
.hero h1 { font-size:clamp(43px,4.6vw,65px);line-height:1.05;letter-spacing:-3.3px;margin:0 0 18px;font-weight:900;color:#26344a;}
.hero h1 em {font-style:normal;color:var(--accent);}
.hero p {max-width:385px;font-size:16px;line-height:1.7;color:#667c99;margin:0 0 25px;}
.hero-cta {background:var(--accent);border:0;color:#fff;border-radius:10px;box-shadow:0 7px 14px #d94e5826;padding:15px 19px;font-size:13px;font-weight:800;display:inline-flex;gap:28px;align-items:center;transition:transform .15s,background .15s;}
.hero-cta:hover {background:var(--accent-strong);transform:translateY(-2px);}
.hero-cta:active {transform:scale(.98);}
.hero-cta span {font-size:18px;}
.hero-art {position:relative;display:flex;align-items:center;justify-content:center;z-index:1; min-width:0;}
.hero-art img {width:100%;max-width:420px;filter:drop-shadow(0 22px 16px rgba(87,105,148,.1));transform:rotate(-2deg);}
.learning-section {padding:42px 4px 0;}
.section-heading h2 {font-size:26px;letter-spacing:-1px;margin:0 0 9px;font-weight:850;}
.section-heading p {font-size:14px;color:var(--muted);line-height:1.6;margin:0 0 25px;}
.lesson-tabs {display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;}
.lesson-tabs button {white-space:nowrap;border:0;background:transparent;color:#8591a4;font-size:13px;font-weight:800;padding:14px 20px;border-bottom:3px solid transparent;}
.lesson-tabs button.selected {color:var(--accent-strong);border-bottom-color:var(--accent);}
.lesson-tabs button:hover {color:var(--accent-strong);}
.lesson-card {background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:32px 36px;box-shadow:0 10px 30px rgba(36,49,71,.025);}
.topic-intro .lesson-stamp {font-size:10px;letter-spacing:1.5px;font-weight:950;color:var(--accent);background:var(--accent-soft);padding:7px 10px;border-radius:6px;display:inline-block;}
.topic-intro h3 {font-size:30px;letter-spacing:-1.2px;margin:13px 0 8px;}
.topic-intro p {margin:0 0 24px;color:var(--muted);line-height:1.7;font-size:14px;}
.topic-intro p strong {color:var(--ink);}
.formula-list {display:grid; gap:0; border:1px solid #e8edf4;border-radius:12px;overflow:hidden;}
.formula-list>div {display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:17px 18px;border-bottom:1px solid #e8edf4;}
.formula-list>div:last-child {border-bottom:0;}
.formula-tag {display:inline-block;flex:0 0 145px;font-size:11px;font-weight:800;letter-spacing:.1px;}
.formula-tag.yes {color:#31816b;}
.formula-tag.no {color:#bd5462;}
.formula-tag.question {color:#5576b4;}
.formula-list code {font-size:14px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:#32445f;white-space:normal;}
.formula-list code b {color:var(--accent-strong);}
.remember {background:#fff5f6;border-left:3px solid var(--accent);padding:16px 18px;border-radius:0 10px 10px 0;font-size:13px;line-height:1.8;color:#684852;margin:20px 0;}
.remember strong {margin-right:6px;color:#ad3341;}
.examples-label {font-weight:900;font-size:10px;letter-spacing:1.5px;color:#8999b0;margin:25px 0 11px;}
.keyword-row {display:flex;flex-wrap:wrap;gap:7px;}
.keyword-row span {background:#eef3fa;border:1px solid #e5ebf3;padding:8px 11px;border-radius:7px;color:#536984;font-size:12px;font-weight:750;}
.example-line {border-top:1px solid var(--line);padding:22px 0 0;margin:22px 0 0;display:flex;gap:15px;flex-wrap:wrap;font-size:14px;}
.example-line span {color:#8997ad;}
.state-list {margin:0 0 25px;}
.state-compare {display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.state-compare>div {border:1px solid #e7ecf4;border-radius:11px;padding:16px;display:flex;flex-direction:column;gap:10px;}
.state-compare span {font-size:10px;color:#39826d;font-weight:900;letter-spacing:1px;}
.state-compare>div:last-child span {color:#c65964;}
.state-compare strong,.state-compare s {font-size:13px;}
.state-compare s {color:#9ba6b6;}
.contrast-strip {margin:20px 0;display:flex;align-items:center;gap:14px;background:#edf3fb;border-radius:14px;padding:17px 22px;}
.contrast-strip>div {display:flex;align-items:center;gap:14px;flex:1;}
.contrast-icon {width:42px;height:42px;border-radius:12px;background:white;display:flex;align-items:center;justify-content:center;font-size:25px;color:var(--accent);flex:none;}
.contrast-strip p {display:flex;flex-direction:column;gap:5px;margin:0;font-size:13px;}
.contrast-strip p small {color:var(--muted);font-size:12px;}
.versus {font-size:10px;color:#99a7bb;font-weight:900;}
.next-action {display:flex;justify-content:space-between;align-items:center;width:100%;border:0;border-radius:12px;background:var(--ink);color:#fff;padding:19px 24px;font-size:14px;font-weight:800;transition:transform .15s;}
.next-action:hover {transform:translateY(-2px);}
.next-action span {font-size:23px;}
.page-heading {display:flex;align-items:center;justify-content:space-between;margin:10px 0 30px;gap:20px;}
.page-eyebrow {color:var(--accent);margin-bottom:10px;}
.page-heading h1,.exam-head h1 {font-size:clamp(36px,4vw,51px);letter-spacing:-2px;margin:0 0 10px;line-height:1.08;font-weight:900;}
.page-heading p {font-size:14px;line-height:1.7;color:var(--muted);margin:0;max-width:550px;}
.count-decoration {min-width:105px;min-height:105px;border:1px dashed #d2dce9;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(8deg);}
.count-decoration strong {font-size:31px;color:var(--accent);line-height:1;}
.count-decoration small {font-size:17px;color:#a1acbd;}
.count-decoration span {font-size:10px;color:#8391a8;font-weight:700;margin-top:7px;}
.exercise-picker {display:flex;gap:8px;overflow-x:auto;padding:3px 0 16px;margin-bottom:9px;scrollbar-width:thin;}
.exercise-pill {display:flex;align-items:center;gap:8px;white-space:nowrap;padding:12px 14px;border:1px solid #e0e7f0;border-radius:10px;background:#fff;color:#8090a4;}
.exercise-pill.selected {border-color:var(--accent);background:var(--accent);color:white;}
.exercise-pill span {font-size:11px;font-weight:900;opacity:.8;}
.exercise-pill strong {font-size:12px;font-weight:800;}
.exercise-pill small {font-size:12px;}
.exercise-sheet {background:white;border:1px solid #dfe7f1;border-radius:16px;overflow:hidden;box-shadow:0 14px 35px rgba(44,59,77,.035);}
.sheet-header {display:flex;align-items:center;justify-content:space-between;gap:20px;padding:30px 33px;border-bottom:1px solid var(--line);}
.sheet-header p {font-size:10px;color:var(--accent);letter-spacing:1.5px;font-weight:900;margin:0 0 9px;}
.sheet-header h2 {font-size:27px;letter-spacing:-.9px;margin:0 0 7px;font-weight:850;}
.sheet-header div:first-child>span {font-size:12px;color:#93a1b4;}
.sheet-counter {font-size:19px;font-weight:900;color:var(--ink);text-align:right;flex:none;}
.sheet-counter small {display:block;color:#8e9db0;font-size:10px;font-weight:600;margin-top:6px;}
.instruction {background:#f1f6fd;color:#687e9b;padding:16px 33px;font-size:12px;line-height:1.7;}
.instruction>span {color:#537eb6;font-size:17px;margin-right:8px;}
.question-list {padding:10px 33px 0;}
.question-row {display:flex;gap:17px;padding:21px 0;border-bottom:1px solid #edf0f5;}
.question-row:last-child {border-bottom:0;}
.question-number {font-size:12px;color:#9aa9bd;font-weight:900;min-width:25px;padding-top:3px;}
.question-content {width:100%;min-width:0;}
.question-prompt {display:block;font-size:15px;line-height:1.6;color:#26354b;font-weight:740;margin-bottom:13px;white-space:pre-wrap;}
.choice-options {display:flex;flex-wrap:wrap;gap:9px;}
.choice {display:flex;align-items:center;gap:8px;border:1px solid #e1e8f0;border-radius:9px;min-height:42px;padding:9px 14px;color:#68788e;font-size:13px;cursor:pointer;transition:all .15s;}
.choice:hover {border-color:#e5a6ac;}
.choice.picked {border-color:var(--accent);background:var(--accent-soft);color:#ae3a46;}
.choice input {position:absolute;opacity:0;width:1px;height:1px;}
.choice:has(input:focus-visible) {outline:3px solid #80a5ee;outline-offset:2px;}
.choice-circle {width:15px;height:15px;border-radius:50%;border:1.5px solid #aebccb;position:relative;flex:none;}
.choice.picked .choice-circle {border-color:var(--accent);}
.choice.picked .choice-circle:after {content:"";width:7px;height:7px;position:absolute;left:3px;top:3px;background:var(--accent);border-radius:50%;}
.answer-input {width:100%;border:1px solid #dfe7f0;background:#fcfdff;color:var(--ink);border-radius:9px;padding:13px 14px;outline:0;font-size:13px;}
.answer-input::placeholder {color:#adb8c6;}
.answer-input:focus {border-color:#8da9d4;box-shadow:0 0 0 3px #e9f1ff;}
.answer-feedback {margin-top:11px;padding:10px 13px;border-radius:8px;font-size:12px;line-height:1.5;font-weight:750;}
.answer-feedback.good {background:#eaf6f1;color:#277257;}
.answer-feedback.bad {background:#fff1f2;color:#ab3c4a;}
.answer-feedback small {display:block;font-size:11px;font-weight:500;margin-top:6px;}
.sheet-footer {display:flex;align-items:center;justify-content:space-between;gap:20px;background:#fbfcfe;border-top:1px solid var(--line);padding:23px 33px;}
.check-summary {font-size:12px;color:#8b98ac;}
.check-summary b {font-size:20px;color:var(--accent);margin-right:6px;}
.check-button {display:flex;gap:24px;align-items:center;border:0;border-radius:9px;padding:15px 17px;background:var(--accent);color:#fff;font-size:12px;font-weight:900;box-shadow:0 8px 16px #d94e5820;}
.check-button:hover {background:var(--accent-strong);}
.check-button:active {transform:scale(.98);}
.check-button span {font-size:16px;}
.sheet-after {display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:15px 33px;background:#fff8f8;color:#885763;font-size:12px;}
.sheet-after button {border:0;background:transparent;color:var(--accent-strong);font-weight:850;}
.below-sheet {display:flex;justify-content:space-between;flex-wrap:wrap;gap:15px;font-size:12px;color:#a0adbd;padding:20px 5px;}
.below-sheet button {border:0;background:transparent;color:#516b94;font-weight:800;}
.exam-head {text-align:center;padding:25px 0 30px;}
.exam-kicker {font-size:10px;letter-spacing:2px;color:var(--accent);font-weight:950;}
.exam-head h1 {margin:12px 0;}
.period {color:var(--accent);}
.exam-head p {max-width:530px;margin:0 auto;color:var(--muted);line-height:1.7;font-size:14px;}
.exam-rules {display:flex;gap:11px;justify-content:center;flex-wrap:wrap;margin-top:22px;}
.exam-rules span {border:1px solid #dfe6f0;background:white;border-radius:100px;color:#778ba5;font-size:11px;font-weight:700;padding:10px 13px;}
.exam-paper {max-width:800px;margin:auto;background:white;border:1px solid #dfe7f0;border-radius:16px;padding:36px 49px;box-shadow:0 18px 40px rgba(44,59,77,.04);position:relative;}
.exam-paper:before {content:"";position:absolute;top:0;left:48px;right:48px;height:5px;background:var(--accent);border-radius:0 0 7px 7px;}
.exam-paper-top {display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:21px;color:#91a0b3;font-size:11px;font-weight:850;letter-spacing:.3px;}
.exam-question {padding:20px 0;border-bottom:1px solid #edf0f4;}
.exam-question label {display:flex;align-items:flex-start;gap:16px;margin-bottom:12px;line-height:1.6;font-size:14px;font-weight:750;color:#34425a;}
.exam-question label span {color:#9eabc0;font-weight:850;font-size:11px;padding-top:3px;min-width:22px;}
.exam-question input {margin-left:38px;width:calc(100% - 38px);border:1px solid #e2e8f1;border-radius:8px;background:#fcfdff;padding:12px 13px;color:var(--ink);font-size:13px;outline:0;}
.exam-question input:focus {border-color:#8da9d4;box-shadow:0 0 0 3px #e9f1ff;}
.exam-question input::placeholder {color:#a8b4c3;}
.exam-answer {margin:9px 0 0 38px;font-size:11px;font-weight:800;}
.exam-question.pass .exam-answer {color:#25856a;}
.exam-question.fail .exam-answer {color:#bd4352;}
.final-score {margin:27px 0 12px;background:#edf3fb;border-radius:13px;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:20px 24px;}
.final-score>div {min-width:125px;}
.final-score small {display:block;font-size:9px;color:#667b99;letter-spacing:1.4px;font-weight:950;}
.final-score strong {font-size:48px;line-height:1.15;color:var(--accent);letter-spacing:-3px;}
.final-score strong span {color:#9caec6;font-size:23px;}
.final-score p {font-size:13px;color:#536885;line-height:1.6;max-width:330px;}
.exam-submit {border:0;background:var(--accent);color:#fff;border-radius:9px;width:100%;font-weight:900;padding:17px 20px;margin-top:30px;display:flex;align-items:center;justify-content:center;gap:18px;}
.exam-submit:hover {background:var(--accent-strong);}
.exam-submit span {font-size:20px;}
.grading-note {font-size:11px;line-height:1.6;color:#a0adbf;text-align:center;margin:16px 0 0;}
.teacher-note {max-width:800px;margin:18px auto 0;background:#e9f0f9;border-radius:12px;padding:16px 20px;color:#5f7390;}
.teacher-note button {display:flex;justify-content:space-between;width:100%;border:0;background:transparent;font-size:12px;font-weight:850;color:#5d7394;text-align:left;}
.teacher-note button span {font-size:19px;}
.teacher-note p {font-size:12px;line-height:1.8;}
.site-footer {border-top:1px solid var(--line);display:flex;gap:20px;justify-content:space-between;padding:20px 40px;color:#9eabbc;font-size:11px;}
@media(max-width:1120px) {
 .workspace {grid-template-columns:235px minmax(0,1fr);}
 .sidebar {padding-left:16px;}
 .main-area {padding:27px 25px 50px;}
 .hero {padding-left:35px;}
 .hero h1 {font-size:46px;letter-spacing:-2.4px;}
 .hero p {font-size:14px;}
}
@media(max-width:800px) {
 .topbar-inner {padding:0 18px;height:65px;}
 .topbar-right {gap:9px;}
 .header-topic {display:none;}
 .workspace {display:block;}
 .sidebar {position:relative;top:auto;min-height:0;border-right:0;padding:13px 16px 0;}
 .sidebar-caption,.sidebar-progress,.reset-link,.sidebar-foot {display:none;}
 .side-menu {display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
 .side-link {padding:11px 8px;justify-content:center;text-align:center;border-radius:9px;}
 .side-link-text strong {font-size:11px;}
 .side-link-text small,.side-num,.side-chevron {display:none;}
 .main-area {padding:22px 16px 45px;}
 .hero {min-height:330px;padding:30px;grid-template-columns:58% 42%;}
 .hero h1 {font-size:clamp(35px,6vw,48px);}
 .hero-art img {max-width:270px;}
 .site-footer {padding:20px 16px;}
}
@media(max-width:580px) {
 .wordmark {font-size:15px;}
 .topbar-inner {height:61px;}
 .mark {width:36px;height:36px;font-size:20px;}
 .hero {display:flex;flex-direction:column-reverse;padding:20px 25px 27px;align-items:flex-start;gap:0;min-height:0;}
 .hero:before {right:-170px;}
 .hero-art {width:100%;height:190px;justify-content:flex-end;overflow:hidden;}
 .hero-art img {max-width:235px;transform:rotate(-3deg) translateY(10px);}
 .hero-copy {padding-top:5px;}
 .hero-kicker {font-size:9px;margin-bottom:12px;}
 .hero h1 {font-size:43px;}
 .hero p {font-size:13px;line-height:1.6;}
 .hero-cta {padding:14px 16px;}
 .learning-section {padding-top:28px;}
 .section-heading h2 {font-size:23px;}
 .lesson-tabs button {font-size:12px;padding:13px 10px;}
 .lesson-card {padding:23px 18px;}
 .topic-intro h3 {font-size:26px;}
 .formula-list>div {padding:14px;gap:7px;}
 .formula-tag {flex-basis:100%;font-size:11px;}

const normalize=(v)=>String(v||"").toLowerCase().replace(/[’‘]/g,"'")

}

}

    <div class="sidebar-progress"><div class="sidebar-progress-heading"><span>Twój postęp</span><strong>${pct}%</strong></div>
    <div class="meter" role="progressbar" aria-label="Postęp ćwiczeń" aria-valuenow="${practiced()}" aria-valuemin="0" aria-valuemax="${totalPractice}"><span style="width:${pct}%"></span></div>
    <p>${practiced()} z ${totalPractice} zadań sprawdzonych</p>
    ${done?`<p class="progress-accent">Ukończone zestawy: ${done}/5</p>`:""}
    </div><button class="reset-link" id="reset-button" type="button">↺ Zacznij od nowa</button>
    <div class="sidebar-foot">Ćwicz we własnym tempie.<br>Wyniki zapisują się w tej przeglądarce.</div>`;
  document.querySelectorAll("[data-nav]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.nav)));
  document.getElementById("reset-button").addEventListener("click",reset);
}
function topicHTML(){
 if(st.lesson==="simple")return `<div class="topic-body"><div class="topic-intro"><span class="lesson-stamp">REGULARNIE</span><h3>Present Simple</h3><p>Używamy, gdy mówimy o <strong>zwyczajach, rutynie, faktach i tym, co zwykle robimy.</strong></p></div>
   <div class="formula-list"><div><span class="formula-tag yes">+ Twierdzenie</span><code>I play. / She <b>plays</b>.</code></div><div><span class="formula-tag no">− Przeczenie</span><code>I <b>don't</b> play. / He <b>doesn't</b> play.</code></div><div><span class="formula-tag question">? Pytanie</span><code><b>Do</b> you play? / <b>Does</b> he play?</code></div></div>
   <div class="remember"><strong>Zapamiętaj!</strong> Przy <b>he / she / it</b> dodajemy <b>-s lub -es</b> w twierdzeniach. Po <b>does / doesn't</b> czasownik nie ma -s.</div>
   <p class="examples-label">SŁOWA WSKAZÓWKI</p><div class="keyword-row"><span>always</span><span>usually</span><span>often</span><span>sometimes</span><span>never</span><span>every day</span><span>on Mondays</span></div>
   <p class="example-line"><strong>She reads every evening.</strong><span>Ona czyta każdego wieczoru.</span></p></div>`;
 if(st.lesson==="continuous")return `<div class="topic-body"><div class="topic-intro"><span class="lesson-stamp">WŁAŚNIE TERAZ</span><h3>Present Continuous</h3><p>Używamy, gdy coś <strong>dzieje się w tej chwili</strong> lub jest sytuacją tymczasową.</p></div>
   <div class="formula-list"><div><span class="formula-tag yes">+ Twierdzenie</span><code>I <b>am playing</b>. / She <b>is playing</b>.</code></div><div><span class="formula-tag no">− Przeczenie</span><code>He <b>isn't sleeping</b>. / We <b>aren't sleeping</b>.</code></div><div><span class="formula-tag question">? Pytanie</span><code><b>Are</b> you playing? / <b>Is</b> she sleeping?</code></div></div>
   <div class="remember"><strong>Zapamiętaj!</strong> Zawsze używamy <b>am/is/are + czasownik-ing</b>. I <b>am</b>, he/she/it <b>is</b>, you/we/they <b>are</b>. Run → running, make → making.</div>
   <p class="examples-label">SŁOWA WSKAZÓWKI</p><div class="keyword-row"><span>now</span><span>right now</span><span>at the moment</span><span>Look!</span><span>Listen!</span><span>these days</span></div>
   <p class="example-line"><strong>She is reading now.</strong><span>Ona czyta właśnie teraz.</span></p></div>`;
 return `<div class="topic-body"><div class="topic-intro"><span class="lesson-stamp">WAŻNY WYJĄTEK</span><h3>State verbs</h3><p>Te czasowniki opisują <strong>uczucia, myśli, wiedzę i posiadanie</strong>. Zwykle używamy ich w Present Simple.</p></div>
   <div class="keyword-row state-list"><span>like</span><span>love</span><span>hate</span><span>want</span><span>need</span><span>know</span><span>understand</span><span>believe</span><span>remember</span><span>prefer</span><span>own</span></div>
   <div class="state-compare"><div><span>✓ DOBRZE</span><strong>I know the answer.</strong></div><div><span>✕ ŹLE</span><s>I am knowing the answer.</s></div></div>
   <div class="remember"><strong>Uwaga na znaczenie!</strong> <b>I have a dog</b> (mam psa), ale <b>I'm having breakfast</b> (jem śniadanie). <b>I think</b> (uważam), ale <b>I'm thinking</b> (zastanawiam się).</div></div>`;
}
function renderLearn(){
 document.getElementById("main-area").innerHTML=`<section class="lesson-area" aria-label="Powtórka materiału">
  <div class="hero"><div class="hero-copy"><div class="hero-kicker">ANGIELSKI BEZ STRESU <span class="kicker-line"></span></div>
   <h1>Dwa czasy.<br><em>Jasna sprawa.</em></h1><p>Present Simple i Present Continuous w prostych słowach. Najpierw zasady, potem praktyka.</p>
   <button type="button" class="hero-cta" data-goto="practice">Przejdź do ćwiczeń <span aria-hidden="true">↗</span></button></div>
   <div class="hero-art" aria-hidden="true"><img src="${HERO}" alt=""></div></div>
  <div class="learning-section"><div class="section-heading"><h2>Najpierw przypomnij sobie zasady</h2><p>Wybierz temat. Każdy ma krótkie wyjaśnienie i przykłady.</p></div>
  <div class="lesson-tabs" role="tablist" aria-label="Wybierz temat gramatyczny">${tabs.map(t=>`<button type="button" role="tab" aria-selected="${t.id===st.lesson}" class="${t.id===st.lesson?"selected":""}" data-lesson="${t.id}">${t.label}</button>`).join("")}</div>
  <div class="lesson-card">${topicHTML()}</div>
  <div class="contrast-strip"><div><span class="contrast-icon">↻</span><p><strong>Every Saturday</strong><small>I play football.</small></p></div><span class="versus">VS</span><div><span class="contrast-icon">◷</span><p><strong>Right now</strong><small>I am playing football.</small></p></div></div>
  <button class="next-action" type="button" data-goto="practice">Gotowe? Sprawdź, ile umiesz <span>→</span></button></div></section>`;
 document.querySelectorAll("[data-lesson]").forEach(el=>el.addEventListener("click",()=>setLesson(el.dataset.lesson)));
 document.querySelectorAll("[data-goto]").forEach(el=>el.addEventListener("click",()=>go(el.dataset.goto)));
}
function qRow(q,i,group){
 const was=checked(group,q.id),pass=!!(st.results[group]||{})[q.id];
 const prompt=escapeHTML(q.prompt);
 const opts=q.kind==="choice"&&q.options?
   `<div class="choice-options">${q.options.map(opt=>`<label class="choice ${st.answers[q.id]===opt?"picked":""}"><input type="radio" name="${q.id}" data-id="${q.id}" data-group="${group}" value="${escapeHTML(opt)}" ${st.answers[q.id]===opt?"checked":""}><span class="choice-circle"></span>${escapeHTML(opt)}</label>`).join("")}</div>`:
   `<input class="answer-input" type="text" id="${q.id}" data-id="${q.id}" data-group="${group}" placeholder="Wpisz odpowiedź po angielsku..." value="${escapeHTML(st.answers[q.id]||"")}" autocomplete="off" spellcheck="false">`;
 return `<div class="question-row ${was?(pass?"is-correct":"is-incorrect"):""}" data-question="${q.id}"><div class="question-number">${String(i+1).padStart(2,"0")}</div>
  <div class="question-content"><label class="question-prompt" ${q.kind==="choice"?"":`for="${q.id}"`}>${prompt}</label>${opts}
  ${was?`<div class="answer-feedback ${pass?"good":"bad"}">${pass?"✓ Dobrze!":"Poprawnie: "+escapeHTML(q.answers[0])}${!pass&&q.note?`<small>${escapeHTML(q.note)}</small>`:""}</div>`:""}</div></div>`;
}
function updateSheetSummary(){
 const el=document.getElementById("sheet-summary");if(!el)return;
 const current=exercises[st.index];const counted=current.questions.filter(q=>(st.answers[q.id]||"").trim()).length;
 const checkedAll=current.questions.every(q=>checked(current.id,q.id));
 const txt=checkedAll?`<b>${score(current.id,current.questions)}/${current.questions.length}</b> poprawnych odpowiedzi`:"Możesz sprawdzać i poprawiać odpowiedzi.";
 el.innerHTML=txt;
 const c=document.getElementById("sheet-counter");if(c)c.innerHTML=`${counted}/${current.questions.length} <small>uzupełnionych</small>`;
}
function renderPractice(){
 const current=exercises[st.index],wasAll=current.questions.every(q=>checked(current.id,q.id));
 const filled=current.questions.filter(q=>(st.answers[q.id]||"").trim()).length;
 const finish=completed();
 document.getElementById("main-area").innerHTML=`<section class="practice-area" aria-label="Zestawy ćwiczeń">
  <div class="page-heading"><div><div class="page-eyebrow">CZAS NA PRAKTYKĘ</div><h1>Ćwiczenia</h1><p>Pięć zestawów od łatwych do trudniejszych. Rozwiązuj w dowolnej kolejności.</p></div><div class="count-decoration"><strong>${finish}<small>/5</small></strong><span>ukończonych</span></div></div>
  <div class="exercise-picker" aria-label="Wybierz zestaw ćwiczeń">${exercises.map((e,i)=>`<button type="button" class="exercise-pill ${st.index===i?"selected":""}" data-set="${i}" aria-pressed="${st.index===i}"><span>${i+1}</span><strong>${escapeHTML(e.title)}</strong>${e.questions.every(q=>checked(e.id,q.id))?"<small>✓</small>":""}</button>`).join("")}</div>
  <div class="exercise-sheet"><div class="sheet-header"><div><p>ZESTAW ${st.index+1} Z 5</p><h2>${escapeHTML(current.title)}</h2><span>${escapeHTML(current.subtitle)}</span></div><div class="sheet-counter" id="sheet-counter">${filled}/${current.questions.length} <small>uzupełnionych</small></div></div>
  <div class="instruction"><span aria-hidden="true">ⓘ</span>${escapeHTML(current.instruction)}</div>
  <div class="question-list">${current.questions.map((q,i)=>qRow(q,i,current.id)).join("")}</div>
  <div class="sheet-footer"><div class="check-summary" id="sheet-summary">${wasAll?`<b>${score(current.id,current.questions)}/${current.questions.length}</b> poprawnych odpowiedzi`:"Możesz sprawdzać i poprawiać odpowiedzi."}</div>
  <button type="button" class="check-button" id="check-practice">${wasAll?"Sprawdź ponownie":"Sprawdź odpowiedzi"} <span>✓</span></button></div>
  ${wasAll?`<div class="sheet-after"><span>${score(current.id,current.questions)===current.questions.length?"Świetnie! Bez błędów.":"Popraw błędne odpowiedzi i sprawdź ponownie."}</span><button type="button" id="next-set">Następny zestaw →</button></div>`:""}
  </div><div class="below-sheet"><span>Ćwiczenia najlepiej robić bez zaglądania do notatek.</span><button type="button" data-goto="learn">Wróć do zasad ↗</button></div></section>`;
 document.querySelectorAll("[data-set]").forEach(b=>b.addEventListener("click",()=>setExercise(+b.dataset.set)));
 document.querySelectorAll("[data-goto]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.goto)));
 document.getElementById("check-practice").addEventListener("click",()=>checkGroup(current.id,current.questions));
 const next=document.getElementById("next-set");if(next)next.addEventListener("click",()=>{st.index=(st.index+1)%exercises.length;render();window.scrollTo({top:0,behavior:"smooth"})});
 wireAnswers();
}
function renderExam(){
 const done=exam.every(q=>checked("exam",q.id));const n=score("exam",exam);
 document.getElementById("main-area").innerHTML=`<section class="exam-area" aria-label="Mini sprawdzian">
 <div class="exam-head"><span class="exam-kicker">SPRAWDŹ SIĘ</span><h1>Mini sprawdzian<span class="period">.</span></h1>
 <p>10 pytań, 10 punktów. Rozwiąż samodzielnie i dopiero na końcu sprawdź wynik.</p>
 <div class="exam-rules"><span>10 pytań</span><span>Około 10 minut</span><span>Oba czasy + state verbs</span></div></div>
 <div class="exam-paper"><div class="exam-paper-top"><span>Present Simple &amp; Present Continuous</span><span>___ / 10 PKT</span></div>
 ${exam.map((q,i)=>{const was=checked("exam",q.id),good=!!(st.results.exam||{})[q.id];return `<div class="exam-question ${was?(good?"pass":"fail"):""}" data-question="${q.id}">
  <label for="${q.id}"><span>${String(i+1).padStart(2,"0")}</span>${escapeHTML(q.prompt)}</label>
  <input type="text" id="${q.id}" data-id="${q.id}" data-group="exam" value="${escapeHTML(st.answers[q.id]||"")}" placeholder="Twoja odpowiedź..." autocomplete="off" spellcheck="false">
  ${was?`<p class="exam-answer">${good?"✓ Poprawnie":"Poprawnie: "+escapeHTML(q.answers[0])}</p>`:""}</div>`;}).join("")}
 ${done?`<div class="final-score"><div><small>TWÓJ WYNIK</small><strong>${n}<span>/10</span></strong></div><p>${n>=9?"Rewelacja! Jesteś dobrze przygotowany.":n>=7?"Bardzo dobrze! Powtórz jeszcze trudniejsze przykłady.":n>=5?"To dobry początek. Wróć do ćwiczeń i spróbuj ponownie.":"Wróć do zasad, poćwicz i podejdź do sprawdzianu ponownie."}</p></div>`:""}
 <button type="button" class="exam-submit" id="check-exam">${done?"Sprawdź ponownie":"Sprawdź sprawdzian"} <span>→</span></button>
 <p class="grading-note">Akceptujemy standardowe skróty, np. isn't = is not. Inne poprawne odpowiedzi nauczyciel może ocenić samodzielnie.</p></div>
 <div class="teacher-note"><button type="button" id="teacher-toggle" aria-expanded="${st.help}">Dla nauczyciela: co warto powtórzyć? <span>${st.help?"−":"+"}</span></button>
 ${st.help?`<p>Najczęstsze pomyłki to: brak <b>-s</b> po he/she/it, dodawanie <b>-s</b> po does/doesn't, pomijanie am/is/are przed -ing oraz używanie -ing z czasownikami stanu takimi jak know i want.</p>`:""}</div></section>`;
 document.getElementById("check-exam").addEventListener("click",()=>checkGroup("exam",exam));
 document.getElementById("teacher-toggle").addEventListener("click",()=>{st.help=!st.help;renderExam()});
 wireAnswers();
}
function wireAnswers(){
 document.querySelectorAll('input[data-id][type="text"]').forEach(el=>el.addEventListener("input",()=>setAnswer(el.dataset.id,el.value,el.dataset.group)));
 document.querySelectorAll('input[data-id][type="radio"]').forEach(el=>el.addEventListener("change",()=>{
   setAnswer(el.dataset.id,el.value,el.dataset.group);
   render();
 }));
}
function render(){
 renderSidebar();
 if(st.mode==="learn")renderLearn();
 else if(st.mode==="practice")renderPractice();
 else renderExam();
}
document.getElementById("brand").addEventListener("click",()=>go("learn"));
render();

</script></body></html>
